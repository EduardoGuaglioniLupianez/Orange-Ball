<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrangeBall | Dashboard</title>
    <link rel="stylesheet" href="css/calendario.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/calendario.js"></script>
</head>

<body onload="verificar_ano_mes(),
verificar_ano_bissexto(), 
gerar_calendario()">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo-sidebar">
            <img src="assets/imgs/LogoOrangeballNova.png" alt="Logo">
            <h2>ORANGEBALL</h2>
        </div>

        <ul class="menu">
            <li><a href="calendario.html" class="menu-item active">
                    <span class="icon">📅</span> Calendário
                </a></li>
            <li><a href="dashboard.html" class="menu-item ">
                    <span class="icon">📊</span> Dashboard
                </a></li>
            <li><a href="adicionar_jogo.html" class="menu-item">
                    <span class="icon">🎯</span> Adicionar Jogo
                </a></li>
            <li><a href="galeria_fotos.html" class="menu-item">
                    <span class="icon">📸</span> Galeria de Fotos
                </a></li>

        </ul>
        <div class="perfil-usuario">
            <div class="avatar">👤</div>
            <div class="info-usuario">
                <p class="nome-usuario">Jogador</p>
                <a href="index.html" class="btn-sair">Sair</a>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="conteudo-principal">

        <!-- HEADER -->
        <div class="header-dashboard">
            <div class="titulo-pagina">
                <h1 id="titulo-secao">Calendario</h1>
                <p id="subtitulo-secao">Aqui você pode relembrar todos os seus momentos e stats!!!</p>
            </div>
            <div class="header-actions">
                <h1 id="titulo-secao">Ano :</h1>
                <select onchange="verificar_ano_mes(),verificar_ano_bissexto(),gerar_calendario()" class="select_ano"
                    id="id_ano" name="Mês do ano">
                    <option value="2026">📅 2026</option>
                    <option value="2027">📅 2027</option>
                </select>
            </div>

            <div class="header-actions">
                <h1 id="titulo-secao">Mês :</h1>
                <select onchange="verificar_ano_mes(),verificar_ano_bissexto(),gerar_calendario()" class="select_ano"
                    id="id_mes" name="Mês do ano">
                    <option class="options_ano" value="janeiro">📅 Janeiro</option>
                    <option value="fevereiro">📅 Fevereiro</option>
                    <option value="marco">📅 Março</option>
                    <option value="abril">📅 Abril</option>
                    <option value="maio">📅 Maio</option>
                    <option value="junho">📅 Junho</option>
                    <option value="julho">📅 Julho</option>
                    <option value="agosto">📅 Agosto</option>
                    <option value="setembro">📅 Setembro</option>
                    <option value="outubro">📅 Outubro</option>
                    <option value="novembro">📅 Novembro</option>
                    <option value="dezembro">📅 Dezembro</option>
                </select>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- SEÇÃO 1: calendario -->
        <!-- ========================================== -->
        <div class="calendario">
            <h2>Maio 2026</h2><br><br>

            <div class="dias-semana">
                <div>Dom</div>
                <div>Seg</div>
                <div>Ter</div>
                <div>Qua</div>
                <div>Qui</div>
                <div>Sex</div>
                <div>Sáb</div>
            </div>

            <div id="id_dias" class="dias">



            </div>
        </div>



    </div>


</body>

</html>
