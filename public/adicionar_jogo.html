<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrangeBall | Dashboard</title>
    <link rel="stylesheet" href="css/calendario.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/calendario.js"></script>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo-sidebar">
            <img src="assets/imgs/LogoOrangeballNova.png" alt="Logo">
            <h2>ORANGEBALL</h2>
        </div>

        <ul class="menu">
            <li><a href="adicionar_jogo.html" class="menu-item active" onclick="mostrarSecao('adicionar-jogo')">
                    <span class="icon">🎯</span> Adicionar Jogo
                </a></li>
            <li><a href="calendario.html" class="menu-item " onclick="mostrarSecao('calendario')">
                    <span class="icon">📅</span> Calendário
                </a></li>
            <li><a href="dashboard.html" class="menu-item " onclick="mostrarSecao('dashboard')">
                    <span class="icon">📊</span> Dashboard
                </a></li>

            <li><a href="galeria_fotos.html" class="menu-item" onclick="mostrarSecao('galeria')">
                    <span class="icon">📸</span> Galeria de Fotos
                </a></li>

            <!-- <li><a href="#" class="menu-item" onclick="mostrarSecao('historico')">
                <span class="icon">📋</span> Histórico
            </a></li> -->
        </ul>

        <div class="perfil-usuario">
            <div class="avatar">👤</div>
            <div class="info-usuario">
                <p class="nome-usuario" id="p_nome">Jogador</p>
                <a href="index.html" class="btn-sair">Sair</a>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="conteudo-principal">

        <!-- HEADER -->
        <div class="header-dashboard">
            <div class="titulo-pagina">
                <h1 id="titulo-secao">Adicionar Jogo🎯</h1>
                <p id="subtitulo-secao">Aqui você pode adicionar suas stats e imagens do seu dia!</p>
            </div>
        </div>
        <div>
            <input type="text" id="id_pts" placeholder="pts">
            <input type="text" id="id_ass" placeholder="ass">
            <input type="text" id="id_reb" placeholder="reb">
            <input type="text" id="id_tentativas" placeholder="tentativas">
            <input type="text" id="id_acertos" placeholder="acertos"><br><br>
            <div id="mensagem_erro"></div>

            <button onclick="inserir_stats()">POSTAR</button>






        </div>









    </div>


</body>
<script>
    p_nome.innerHTML= sessionStorage.NOME_USUARIO

    function inserir_stats() {
        var pts = id_pts.value;
        var ass = id_ass.value;
        var reb = id_reb.value;
        var tentativas = id_tentativas.value;
        var acertos = id_acertos.value;
        var idsessao = sessionStorage.ID_USUARIO;
        if (
            pts == "" ||
            ass == "" ||
            reb == "" ||
            tentativas == "" ||
            acertos == ""
        ) {
            
            mensagem_erro.innerHTML =
                "Algum campo está vazio tente novamente";
            return false;
        } 
        // Enviando o valor da nova input
        fetch("/stats/inserstats", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                ptsServer: pts,
                assServer: ass,
                rebServer: reb,
                tentativasServer: tentativas,
                acertosServer: acertos,
                fkUsuarioServer: idsessao
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {


                    setTimeout(() => {
                        window.location = "adicionar_jogo.html";
                    }, "2000");

                  
                } else {
                    throw "Houve um erro ao tentar realizar o insert";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });

        return false;
    }













    

</script>

</html>
