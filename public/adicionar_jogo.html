<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrangeBall | Adicionar Jogo</title>
    <link rel="stylesheet" href="css/adicionar_jogo.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo-sidebar">
            <img src="assets/imgs/LogoOrangeballNova.png" alt="Logo">
            <a href="index.html" class="icon">ORANGEBALL</a>
        </div>

        <div class="menu">
            <li><a href="adicionar_jogo.html" class="menu-item active">
                    <img src="assets/imgs/adicionarjogo.png" class="icon"> Adicionar Jogo
                </a></li>
            <li><a href="dashboard.html" class="menu-item">
                    <img src="assets/imgs/dashboardicon.png" class="icon"> Dashboard
                </a></li>
            
            <li><a href="calendario.html" class="menu-item">
                    <img src="assets/imgs/Calendarioicon.png" class="icon"> Calendário
                </a></li>

        </div>

        <div class="perfil-usuario">
            <div class="info-usuario">
                <p class="nome-usuario" id="p_nome">Jogador</p>
                <a href="index.html" class="btn-sair">Sair</a>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="conteudo-principal">

        <!-- HEADER -->
        <div class="header-dashboard">
            <div class="titulo-pagina">
                <h1>Adicionar Jogo</h1>
                <p>Registre suas estatísticas, fotos e vídeos da partida!</p>
            </div>
        </div>

        <!-- SEÇÃO: ESTATÍSTICAS DO JOGO -->
        <div class="card-secao">
            <h2 class="titulo-card">Suas Estatísticas</h2>

            <div class="grid-stats">
                <div class="stat-box">
                    <label>Pontos (PTS)</label>
                    <input type="number" id="id_pts" placeholder="0" min="0">
                </div>
                <div class="stat-box">
                    <label>Rebotes (REB)</label>
                    <input type="number" id="id_reb" placeholder="0" min="0">
                </div>
                <div class="stat-box">
                    <label>Assistências (AST)</label>
                    <input type="number" id="id_ass" placeholder="0" min="0">
                </div>
            </div>

            <div class="linha-inputs" style="margin-top: 20px;">
                <div class="grupo-input">
                    <label>Arremessos de quadra | Tentados / Feitos</label>
                    <div class="input-duplo">
                        <input type="number" id="id_tentativas" placeholder="20" min="0">
                        <span>/</span>
                        <input type="number" id="id_acertos" placeholder="10" min="0">
                    </div>
                </div>
                <div class="linha-inputs">
                    <div class="grupo-input">
                        <label>Local</label>
                        <input type="text" id="id_local" placeholder="Ex: Quadra do Bairro">
                    </div>
                    <div class="grupo-input">
                        <label>Horas jogadas</label>
                        <input type="number" id="id_tempo" placeholder="Ex: 3" min="0">
                    </div>
                </div>
            </div>

            <div id="mensagem_erro" style="color: #ff4444; margin-top: 10px; font-weight: 600;"></div>
        </div>



        <!-- SEÇÃO: como foi o jogo? -->
        <div class="card-secao">
            <h2 class="titulo-card">Como foi o jogo?</h2>

            <div class="grupo-input">
                <label>Descrição / Notas do Jogo</label>
                <textarea id="id_descricao" rows="6" placeholder="Como foi hoje o dia?"></textarea>
            </div>


            <!-- MENSAGEM DE STATUS -->
            <div id="mensagem_status" style="margin-top: 15px; font-weight: 600; font-size: 15px;"></div>

            <!-- BOTÕES -->
            <div class="botoes-finais">
                <button class="btn-salvar" id="btn_salvar" onclick="inserir_stats()">
                    Salvar Jogo
                </button>
            </div>

        </div>

    </div>
    <script src="js/adicionar_jogo.js"></script>
</body>

</html>
