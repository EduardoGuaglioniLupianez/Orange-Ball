<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrangeBall | Dashboard</title>
    <link rel="stylesheet" href="css/dashboards.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="obterTreinoMes()">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo-sidebar">
            <img src="assets/imgs/LogoOrangeballNova.png" alt="Logo">
            <h2>ORANGEBALL</h2>
        </div>

        <ul class="menu">
            <li><a href="dashboard.html" class="menu-item active" onclick="mostrarSecao('dashboard')">
                    <span class="icon">📊</span> Dashboard
                </a></li>
            <li><a href="calendario.html" class="menu-item" onclick="mostrarSecao('calendario')">
                    <span class="icon">📅</span> Calendário
                </a></li>
            <li><a href="adicionar_jogo.html" class="menu-item" onclick="mostrarSecao('adicionar-jogo')">
                    <span class="icon">🎯</span> Adicionar Jogo
                </a></li>
            <li><a href="galeria_fotos.html" class="menu-item" onclick="mostrarSecao('galeria')">
                    <span class="icon">📸</span> Galeria de Fotos
                </a></li>

            <!-- <li><a href="#" class="menu-item" onclick="mostrarSecao('historico')">
                <span class="icon">📋</span> Histórico
            </a></li> -->
        </ul>

        <div class="perfil-usuario">
            <div class="avatar">👤</div>
            <div class="info-usuario">
                <p class="nome-usuario">Jogador</p>
                <a href="index.html" class="btn-sair">Sair</a>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="conteudo-principal">

        <!-- HEADER -->
        <div class="header-dashboard">
            <div class="titulo-pagina">
                <h1 id="titulo-secao">Dashboard</h1>
                <p id="subtitulo-secao">Visão geral do seu desempenho</p>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- SEÇÃO 1: DASHBOARD (GRÁFICOS) -->
        <!-- ========================================== -->
        <div id="secao-dashboard" class="secao ativa">

            <div class="cards-resumo">
                <div class="card-stat">
                    <div class="icon-stat">🏀</div>
                    <div class="info-stat">
                        <p class="label-stat">Treinos este mês</p>
                        <h2 class="numero-stat" id="id_treinos_mes">0</h2>
                    </div>
                </div>

                <div class="card-stat">
                    <div class="icon-stat">⭐</div>
                    <div class="info-stat">
                        <p class="label-stat">Média de pontos</p>
                        <h2 class="numero-stat">0.0</h2>
                    </div>
                </div>
                <div class="card-stat">
                    <div class="icon-stat">📈</div>
                    <div class="info-stat">
                        <p class="label-stat">Evolução</p>
                        <h2 class="numero-stat">+0%</h2>
                    </div>
                </div>
            </div>

            <div class="graficos-container">
                <div class="card-grafico">
                    <h3>Desempenho nos Treinos</h3>
                    <canvas id="graficoTreinos"></canvas>
                </div>
                <div class="card-grafico">
                    <h3>Pontos por Jogo</h3>
                    <canvas id="graficoPontos"></canvas>
                </div>
            </div>

            <div class="graficos-container">
                <div class="card-grafico full-width">
                    <h3>Evolução Mensal</h3>
                    <canvas id="graficoEvolucao"></canvas>
                </div>
            </div>

        </div>

    </div>


</body>
<script>
    function obterTreinoMes() {
        let fk_usuario = sessionStorage.ID_USUARIO;

        fetch(`/stats/listarTreinosMes/${fk_usuario}`, {
            method: "GET",
            headers: {
                "Content-Type": "application/json",
            }
        })
            .then(function (resposta) {

                if (resposta.ok) {
                    
                    resposta.json().then(function (resposta) {
                        console.log(`dados recebidos: ${JSON.stringify(resposta)}`)

                        plotartreinomes(resposta)

                    });
                } else {
                    throw "houve um erro ao tentar buscar stats de dia"
                }
            })
            .catch(function (resposta) {
                console.log(`erro ao atualizar: ${resposta}`);
            })
    }
    function plotarTreinoMes(resposta){
        console.log(resposta)
        let qtd_treinos = resposta[0].qnt_total_treino;

        id_treinos_mes.innerHTML = `${qtd_treinos}`

        console.log(qtd_treinos)



    }









</script>

</html>
